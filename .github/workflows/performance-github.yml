name: performance-tests-github
permissions:
  contents: read

on:
  push:
    branches:
      - "main" # or "master"
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

env:
  TELEMETRY_ENABLED: false
  NODE_OPTIONS: "--max_old_space_size=8192"
  PR_TITLE: ${{ github.event.pull_request.title }}
  APP_HARNESS_HEADLESS: 1
  PYTHONUNBUFFERED: 1

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    env:
      CODSPEED_LOG: debug
      # CODSPEED_USE_PERF: 1
      CODSPEED_RUNNER_MODE: "walltime"
    steps:
      - uses: actions/checkout@v4

      # Using this action is still necessary for CodSpeed to work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync -v --all-extras --dev

      - name: Install ubuntu deps
        run: |
          sudo apt-get update
          sudo apt-get install libsass-dev

      # - name: Check fp support
      #   run: |
      #     uv run python -m sysconfig | grep 'no-omit-frame-pointer' || true

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v3
        env:
          CODSPEED_LOG: debug
          # CODSPEED_USE_PERF: 1
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: uv run pytest tests/benchmarks --codspeed --codspeed-max-time 10
          runner-version: latest
