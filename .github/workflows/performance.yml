name: performance-tests-macro
permissions:
  contents: read

on:
  push:
    branches:
      - "main" # or "master"
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

env:
  TELEMETRY_ENABLED: false
  NODE_OPTIONS: "--max_old_space_size=8192"
  PR_TITLE: ${{ github.event.pull_request.title }}
  APP_HARNESS_HEADLESS: 1
  PYTHONUNBUFFERED: 1

jobs:
  benchmarks:
    name: Run benchmarks
    # runs-on: ubuntu-latest
    runs-on: codspeed-macro-staging
    env:
      CODSPEED_LOG: debug
      # CODSPEED_USE_PERF: 1
      CODSPEED_RUNNER_MODE: "walltime"
    steps:
      - uses: actions/checkout@v4

      # Using this action is still necessary for CodSpeed to work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync -v --all-extras --dev

      - name: Install ubuntu deps
        run: |
          sudo apt-get update
          sudo apt-get install libsass-dev

      # - name: Check fp support
      #   run: |
      #     uv run python -m sysconfig | grep 'no-omit-frame-pointer' || true

      - uses: moonrepo/setup-rust@v1
        with:
          channel: '1.88.0'

      - name: Install runner from git
        run: cargo install --git https://github.com/CodSpeedHQ/runner.git --branch cod-992-perf-works-in-github-action-but-not-locally

      - name: Run benchmarks
        run: codspeed run --api-url https://gql.staging.preview.codspeed.io/ --upload-url https://api.staging.preview.codspeed.io/upload -- uv run pytest tests/benchmarks --codspeed
        env:
          CODSPEED_LOG: debug
          CODSPEED_RUNNER_MODE: "walltime"
          CODSPEED_PERF_ENABLED: true
          CODSPEED_TOKEN: ${{ secrets.CODSPEED_TOKEN }}

      # - name: Run benchmarks
      #   uses: CodSpeedHQ/action@v4
      #   env:
      #     CODSPEED_LOG: debug
      #     CODSPEED_PERF_ENABLED: true
      #   with:
      #     token: ${{ secrets.CODSPEED_TOKEN }}
      #     mode: walltime
      #     run: uv run pytest tests/benchmarks --codspeed
      #     upload-url: https://api.staging.preview.codspeed.io/upload
